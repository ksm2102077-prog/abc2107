<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>遠距離狙撃</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#11130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="css/sniper.css">
</head>
<body>

<!-- タイトル -->
<section id="scr-title" class="screen menu">
  <div class="title-wrap">
    <p class="eyebrow mono">EXTERNAL BALLISTICS · G7 · MIL/MIL</p>
    <h1 class="game-title">遠距離狙撃</h1>
    <p class="lede">距離を測り、DOPEを引き、風を読み、ダイヤルを回して、一発で仕留める。<br>弾道は実弾のデータをもとに、重力・空気抵抗・風・気温・気圧・スピンドリフト・コリオリまで計算する。</p>
    <div class="title-actions">
      <button id="btn-campaign" class="btn primary">キャンペーン</button>
      <button id="btn-howto" class="btn">遊び方と手順</button>
      <button id="btn-settings-t" class="btn">設定</button>
    </div>
    <p class="fine">横向き推奨。音が出ます。</p>
  </div>
</section>

<!-- キャンペーン -->
<section id="scr-campaign" class="screen menu" hidden>
  <header class="bar"><button class="btn ghost" data-go="title">← 戻る</button><h2>キャンペーン</h2><span></span></header>
  <div id="mission-list" class="mission-list"></div>
</section>

<!-- ブリーフィング -->
<section id="scr-brief" class="screen menu" hidden>
  <header class="bar"><button class="btn ghost" data-go="campaign">← 任務一覧</button><h2 id="brief-title">任務</h2><span id="brief-place" class="mono dim"></span></header>
  <div class="brief-body" id="brief-body"></div>
  <footer class="bar foot"><span id="brief-sel" class="dim"></span><button id="btn-deploy" class="btn primary">出撃</button></footer>
</section>

<!-- ゲーム -->
<section id="scr-game" class="screen game" hidden>
  <canvas id="view"></canvas>
  <canvas id="reticle"></canvas>
  <div id="dust-veil"></div>
  <div id="hit-flash"></div>

  <div class="hud hud-tl">
    <div class="alert-box"><span id="hud-alert" class="alert-chip a0">平常</span><div class="meter"><i id="hud-detect"></i></div></div>
    <div id="guide" class="guide" role="status" aria-live="polite">
      <div class="g-head"><span id="g-n" class="g-n mono">1/7</span><b id="g-title">標的を探す</b></div>
      <div id="g-text" class="g-text"></div>
      <div id="hud-obj" class="g-obj"></div>
    </div>
  </div>
  <div class="hud hud-tc mono"><span id="hud-az">方位 000°</span><span id="hud-inc">傾斜 +0.0°</span><span id="hud-time">00:00</span></div>
  <div class="hud hud-tr">
    <button class="tool" id="tool-calc" data-panel="calc">弾道<br>計算</button>
    <button class="tool" id="tool-dope" data-panel="dope">DOPE</button>
    <button class="tool" id="tool-range" data-panel="range">レンジ<br>カード</button>
    <button class="tool" id="tool-task" data-panel="task">任務</button>
    <button class="tool" id="tool-pause" data-panel="pause" aria-label="一時停止">‖</button>
  </div>

  <div class="hud hud-left">
    <div class="seg" id="mode-seg">
      <button data-mode="eye" id="mode-eye">肉眼</button>
      <button data-mode="spot" id="mode-spot">観測</button>
      <button data-mode="rifle" id="mode-rifle" class="on">照準</button>
    </div>
    <div class="zoom">
      <button id="zoom-in" aria-label="拡大">＋</button>
      <span id="zoom-val" class="mono">25×</span>
      <button id="zoom-out" aria-label="縮小">−</button>
    </div>
    <button id="btn-lrf" class="small-btn lrf-btn">測距</button>
    <button id="btn-wind" class="small-btn">観測手<br>風は？</button>
  </div>

  <div class="hud hud-right">
    <div class="turret" id="tur-elev">
      <span class="t-label">エレベーション</span>
      <button class="t-btn" data-t="e" data-d="1" aria-label="上へ1クリック">▲</button>
      <div class="t-val mono" id="elev-val">0.0</div>
      <button class="t-btn" data-t="e" data-d="-1" aria-label="下へ1クリック">▼</button>
      <span class="t-rev mono" id="elev-rev">0回転</span>
    </div>
    <div class="turret wind" id="tur-wind">
      <span class="t-label">ウィンデージ</span>
      <div class="t-val mono" id="wind-val">0.0</div>
      <div class="t-row"><button class="t-btn" data-t="w" data-d="-1" aria-label="左へ1クリック">◀</button><button class="t-btn" data-t="w" data-d="1" aria-label="右へ1クリック">▶</button></div>
    </div>
  </div>

  <div class="hud hud-br">
    <div class="ammo mono" id="hud-ammo">5/5</div>
    <button id="btn-bolt" class="act">ボルト</button>
    <button id="btn-breath" class="act">息止め</button>
    <button id="btn-trigger" class="trigger" aria-label="引き金（押し続けると撃てる）"><span>引き金</span><i id="squeeze"></i></button>
  </div>

  <div class="hud hud-bc">
    <div id="hud-lrf" class="lrf mono" hidden></div>
    <button id="btn-corr" class="corr" hidden>修正を反映</button>
    <div id="spotter-line" class="spotter"></div>
    <div id="hud-hint" class="hint"></div>
  </div>

  <!-- パネル -->
  <div id="panel" class="panel" hidden>
    <div class="panel-card">
      <header class="bar"><h3 id="panel-title"></h3><button id="panel-close" class="btn ghost">閉じる</button></header>
      <div id="panel-body" class="panel-body"></div>
    </div>
  </div>

  <!-- 人物の識別 -->
  <div id="idcard" class="idcard" hidden></div>
</section>

<!-- 結果 -->
<section id="scr-debrief" class="screen menu" hidden>
  <header class="bar"><span></span><h2 id="deb-title">任務結果</h2><span></span></header>
  <div class="deb-body" id="deb-body"></div>
  <footer class="bar foot"><button class="btn" id="btn-retry">もう一度</button><button class="btn primary" id="btn-next">任務一覧へ</button></footer>
</section>

<!-- 汎用モーダル（遊び方・設定） -->
<div id="modal" class="panel" hidden>
  <div class="panel-card">
    <header class="bar"><h3 id="modal-title"></h3><button id="modal-close" class="btn ghost">閉じる</button></header>
    <div id="modal-body" class="panel-body"></div>
  </div>
</div>

<div id="loading" class="loading" hidden><p class="mono">地形を生成中…</p></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="js/ballistics.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/actors.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
